version: 0.2

# Semgrep Security Scanning Buildspec
# Runs static application security testing (SAST) on source code
# Fails pipeline if critical/high severity vulnerabilities are found

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing Semgrep..."
      - pip install semgrep
      - semgrep --version

  build:
    commands:
      - echo "Running Semgrep security scan..."
      - echo "Scanning with auto-configuration (OWASP Top 10, security best practices)..."

      # Run Semgrep with automatic rules (includes OWASP Top 10, security best practices)
      - semgrep --config=auto --json --output=semgrep-results.json . || true
      - semgrep --config=auto --sarif --output=semgrep-results.sarif . || true

      # Generate human-readable report
      - semgrep --config=auto --text . > semgrep-report.txt || true

      # Parse results and check severity
      - |
        if [ -f semgrep-results.json ]; then
          echo "=== Semgrep Scan Results ==="

          # Count findings by severity
          CRITICAL_COUNT=$(cat semgrep-results.json | jq '[.results[] | select(.extra.severity == "ERROR")] | length')
          WARNING_COUNT=$(cat semgrep-results.json | jq '[.results[] | select(.extra.severity == "WARNING")] | length')
          INFO_COUNT=$(cat semgrep-results.json | jq '[.results[] | select(.extra.severity == "INFO")] | length')

          echo "Critical/Error issues: $CRITICAL_COUNT"
          echo "Warning issues: $WARNING_COUNT"
          echo "Info issues: $INFO_COUNT"

          # Create summary
          echo "=== Semgrep Security Scan Summary ===" > scan-summary.txt
          echo "Scan Date: $(date)" >> scan-summary.txt
          echo "Critical/Error Issues: $CRITICAL_COUNT" >> scan-summary.txt
          echo "Warning Issues: $WARNING_COUNT" >> scan-summary.txt
          echo "Info Issues: $INFO_COUNT" >> scan-summary.txt
          echo "" >> scan-summary.txt
          echo "=== Detailed Report ===" >> scan-summary.txt
          cat semgrep-report.txt >> scan-summary.txt

          # Fail pipeline if critical issues found
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "FAIL: $CRITICAL_COUNT critical security issues found!"
            echo "Review semgrep-report.txt for details"
            cat semgrep-report.txt
            exit 1
          else
            echo "PASS: No critical security issues found"
          fi
        else
          echo "Warning: Semgrep results file not generated"
          exit 1
        fi

artifacts:
  files:
    - semgrep-results.json
    - semgrep-results.sarif
    - semgrep-report.txt
    - scan-summary.txt
  name: semgrep-scan-$(date +%Y%m%d-%H%M%S)
