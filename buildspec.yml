version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      # Install Docker
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlay2 &
      - timeout 15 sh -c "until docker info; do echo .; sleep 1; done"

  pre_build:
    commands:
      # Validate we have required environment variables
      - echo "Validating environment variables..."
      - |
        if [ -z "$COGNITO_USER_POOL_ID" ] || [ -z "$COGNITO_CLIENT_ID" ] || [ -z "$API_GATEWAY_ENDPOINT" ]; then
          echo "ERROR: Required environment variables not set"
          echo "Cognito User Pool ID: ${COGNITO_USER_POOL_ID:-empty}"
          echo "Cognito Client ID: ${COGNITO_CLIENT_ID:-empty}"
          echo "API Gateway Endpoint: ${API_GATEWAY_ENDPOINT:-empty}"
          exit 1
        fi

      # Determine redirect URL
      - |
        case "$FRONTEND_DOMAIN" in
          *localhost*|*elb.amazonaws.com*)
            REDIRECT_SIGN_IN="http://${FRONTEND_DOMAIN}/"
            REDIRECT_SIGN_OUT="http://${FRONTEND_DOMAIN}/"
            ;;
          *)
            REDIRECT_SIGN_IN="https://${FRONTEND_DOMAIN}/"
            REDIRECT_SIGN_OUT="https://${FRONTEND_DOMAIN}/"
            ;;
        esac
        echo "Frontend redirect URLs: $REDIRECT_SIGN_IN / $REDIRECT_SIGN_OUT"

      # Login to ECR
      - echo "Logging in to ECR..."
      - REPO_REGION=$(echo "$FRONTEND_ECR_REPO" | sed -n 's/.*\.dkr\.ecr\.\([^.]*\)\..*/\1/p' || echo "$AWS_REGION")
      - aws ecr get-login-password --region "$REPO_REGION" | docker login --username AWS --password-stdin "$FRONTEND_ECR_REPO"

  build:
    commands:
      # Extract tag from CODEBUILD_SOURCE_VERSION if present
      - |
        case "$CODEBUILD_SOURCE_VERSION" in
          refs/tags/*)
            export TAG_NAME="${CODEBUILD_SOURCE_VERSION#refs/tags/}"
            echo "Building from tag: $TAG_NAME"
            ;;
          *)
            export TAG_NAME="latest"
            echo "Building from branch, using latest tag"
            ;;
        esac

      # Build frontend Docker image for linux/amd64
      - echo "Building frontend Docker image for linux/amd64..."

      - |
        docker build --platform linux/amd64 \
          --build-arg REACT_APP_AWS_REGION="${AWS_REGION}" \
          --build-arg REACT_APP_COGNITO_USER_POOL_ID="${COGNITO_USER_POOL_ID}" \
          --build-arg REACT_APP_COGNITO_CLIENT_ID="${COGNITO_CLIENT_ID}" \
          --build-arg REACT_APP_COGNITO_DOMAIN="${COGNITO_DOMAIN}" \
          --build-arg REACT_APP_API_URL="${API_GATEWAY_ENDPOINT}" \
          --build-arg REACT_APP_REDIRECT_SIGN_IN="${REDIRECT_SIGN_IN}" \
          --build-arg REACT_APP_REDIRECT_SIGN_OUT="${REDIRECT_SIGN_OUT}" \
          -t frontend:$TAG_NAME .

      # Tag for ECR
      - echo "Tagging for ECR..."
      - docker tag frontend:$TAG_NAME "${FRONTEND_ECR_REPO}:${TAG_NAME}"
      - docker tag frontend:$TAG_NAME "${FRONTEND_ECR_REPO}:latest"
      - docker tag frontend:$TAG_NAME "${FRONTEND_ECR_REPO}:build-${CODEBUILD_BUILD_NUMBER}"

  post_build:
    commands:
      # Push to ECR
      - echo "Pushing to ECR..."
      - docker push "${FRONTEND_ECR_REPO}:${TAG_NAME}"
      - docker push "${FRONTEND_ECR_REPO}:latest"
      - docker push "${FRONTEND_ECR_REPO}:build-${CODEBUILD_BUILD_NUMBER}"

      # Create imagedefinitions.json for ECS deployment
      - |
        printf '[{"name":"frontend","imageUri":"%s"}]' "${FRONTEND_ECR_REPO}:${TAG_NAME}" > imagedefinitions.json

      - echo "Frontend build complete!"
      - echo "Tag is $TAG_NAME"
      - echo "Image is ${FRONTEND_ECR_REPO}:${TAG_NAME}"

artifacts:
  files:
    - imagedefinitions.json

